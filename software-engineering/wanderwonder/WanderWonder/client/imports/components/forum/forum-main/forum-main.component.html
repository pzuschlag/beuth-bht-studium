<div id="bg">
    <search searchFor="forum"></search>
    <div class="row">
        <div class="col s10 offset-s1">
            <ul class="collection with-header">
                <li class="collection-header">
                    <h5>Themen</h5>
                </li>
                <li *ngFor="let topic of topics" class="collection-item dismissable">
                    <div>
                        {{topic.txt}}
                        <a href="#!" class="secondary-content">
                            <i class="fa fa-info-circle"></i>
                        </a>
                    </div>
                </li>
            </ul>
        </div>
    </div>
</div>
<a [routerLink]="['']"><i id="right" class="fa fa-chevron-right"></i></a>
