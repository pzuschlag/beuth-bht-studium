<!--MODAL TRIGGER-->
<a class="btn-floating btn-large waves-effect modal-trigger" materialize="leanModal" href="#provider-settings">
    <i class="fa fa-cog fa-4x"></i>
</a>
<!--MODAL CONTENT-->
<div id="provider-settings" class="modal bottom-sheet modal-fixed-footer">
    <div class="modal-content">
        <h4>Settings</h4>
        <ul class="collection">
            <li class="collection-item">
                <div>Offer Ticket
                    <a href="#!" class="secondary-content">
                        <div class="switch">
                            <label>
                                Off
                                <input type="checkbox" [checked]="_jsonHandler.ticketProvided" (click)="toggleProvided()"><span class="lever"></span> On
                            </label>
                        </div>
                    </a>
                </div>
            </li>
            <li class="collection-item">
                <div>
                    <span>Selected Ticket</span>
                    <div id="select-wrapper" class="secondary-content">
                        <select class="browser-default col s6" [(ngModel)]="_jsonHandler.ticket" dir="rtl">
                            <option value="undefined" disabled>Choose your Ticket</option>
                            <option *ngFor="let ticket of _tickets" [value]="ticket.key">{{ticket.value}}</option>
                        </select>
                    </div>
                </div>
            </li>
        </ul>
    </div>
    <div class="modal-footer">
        <a (click)="save()" href="#!" class="modal-action modal-close waves-effect btn-flat">Save</a>
        <a (click)="reset()" id="resetBtn" class="waves-effect btn-flat">Reset App</a>
    </div>
</div>
