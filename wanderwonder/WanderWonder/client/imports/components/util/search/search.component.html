<div class="row">
    <div class="col s10 offset-s1">
        <i class="prefix fa fa-search"></i>
        <input placeholder="Suche" id="search" type="text" class="validate" [ngFormControl]="_search">
    </div>
    <div class="col s10 offset-s1">
        <div class="result-wrapper">
            <a *ngFor="let result of _results; let i = index" (click)=setRoute(i)>
                {{result._name}}
            </a>
        </div>
    </div>
</div>
