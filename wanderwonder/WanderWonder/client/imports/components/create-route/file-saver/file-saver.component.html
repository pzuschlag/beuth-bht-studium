<!--MODAL TRIGGER-->
<a class="btn-flat modal-trigger" materialize="leanModal" href="#fileSaver"><i class="fa fa-floppy-o"></i></a>
<!--MODAL CONTENT-->
<div id="fileSaver" class="modal modal-fixed-footer">
    <div class="modal-content">
        <h5>Route speichern</h5>
        <form>
            <div class="row">
                <div class="input-field col s12">
                    <input id="filename" type="text" class="validate" [(ngModel)]="_metadata.name">
                    <label for="filename">Dateiname</label>
                </div>
                <div class="input-field col s12">
                    <input id="description" type="text" class="validate" [(ngModel)]="_metadata.desc">
                    <label for="description">Beschreibung</label>
                </div>
                <div class="input-field col s12">
                    <input id="author" type="text" class="validate" [(ngModel)]="_metadata.author">
                    <label for="author">Author</label>
                </div>
                <!-- Disabled Switch -->
                <div class="input-field col s12">
                    <div class="switch">
                        <label>
                            GPX
                            <input type="checkbox" (change)="_gpx = !_gpx">
                            <span class="lever"></span> Datenbank
                        </label>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div class="modal-footer">
        <a href="#!" class="modal-action modal-close waves-effect btn-flat">abbrechen</a>
        <a href="#!" class="modal-action modal-close waves-effect btn-flat" *ngIf="_metadata.name" (click)="saveRoute()">speichern</a>
    </div>
</div>
